<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>회원가입</title>
</head>
<body>
<h1>회원가입</h1>

<form th:action="@{/signup}" th:object="${member}" method="post">

    <label>아이디:</label>
    <input type="text" th:field="*{id}"><br><br>

    <label>비밀번호:</label>
    <input type="password" th:field="*{pw}"><br><br>

    <button type="submit">가입하기</button>
</form>
</body>
</html>
