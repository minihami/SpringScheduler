<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>로그인</title>
</head>
<body>
<h1>로그인</h1>

<form th:action="@{/login}" th:object="${member}" method="post">

    <p th:if="${loginError}" th:text="${loginError}" style="color:red;"></p>

    <label>아이디:</label>
    <input type="text" th:field="*{id}"><br><br>

    <label>비밀번호:</label>
    <input type="password" th:field="*{pw}"><br><br>

    <button type="submit">로그인</button>
</form>

<p><a th:href="@{/signup}">회원가입하기</a></p>
</body>
</html>
